spring.application.name=jamTesSystem
spring.config.import=optional:file:./env.properties

server.port=8080

#PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jamTesSystem
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

# Email configuration (set these values for real email delivery)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true
app.email.from=${MAIL_USERNAME:no-reply@localhost}
pharmacy.warning.email.to=${MAIL_USERNAME:admin@localhost}
app.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:3000/login}


#Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}